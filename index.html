<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>개인 가계부</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f8f82">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f3f6ee; --surface:#ffffff; --surface-2:#edf1e6;
    --ink:#181c14; --muted:#5c6353; --muted-2:#8b9280;
    --line:#d6dbc7; --line-soft:#e7ebde;
    --accent:#0f8f82; --accent-ink:#0b6b61; --accent-soft:rgba(15,143,130,.14);
    --pos:#2fa66b; --warn:#e2833a; --over:#e2574a;
    --save:#0f8f82; --save-soft:rgba(15,143,130,.16);
    --shadow:rgba(28,40,35,.10);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --p0:#e2707a; --p1:#e0a63a; --p2:#c98fd1; --p3:#3a8fc9; --p4:#8b95a8; --p5:#6a63c4;
    --p6:#4fb0c9; --p7:#a29bdb; --p8:#d9668a; --p9:#b6805c; --p10:#0f8f82; --p11:#8f9483;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12180f; --surface:#1a221b; --surface-2:#202a20;
      --ink:#eef3e7; --muted:#a3ab97; --muted-2:#727a67;
      --line:#2f3a2c; --line-soft:#232d21;
      --accent:#3fd9c7; --accent-ink:#8ff0e4; --accent-soft:rgba(63,217,199,.18);
      --pos:#5fd591; --warn:#f0a24f; --over:#f07a6d;
      --save:#3fd9c7; --save-soft:rgba(63,217,199,.2);
      --shadow:rgba(0,0,0,.38);
      --p0:#f2909a; --p1:#f0c15a; --p2:#dba8e0; --p3:#6fb4ec; --p4:#a7b0c2; --p5:#a29bff;
      --p6:#7dd3e8; --p7:#c3bcff; --p8:#ec8fac; --p9:#d1a17e; --p10:#3fd9c7; --p11:#aab0a0;
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; letter-spacing:-.01em; }
  button{ font:inherit; }
  input{ font:inherit; }

  .app{ max-width:420px; margin:0 auto; padding:18px 16px 100px; display:flex; flex-direction:column; gap:16px; min-height:100dvh; position:relative; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-weight:700; font-size:17px; letter-spacing:-.01em; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:border-color 150ms var(--ease-out), color 150ms var(--ease-out);
  }
  .icon-btn:hover{ border-color:var(--accent); color:var(--accent-ink); }

  .sync-indicator{
    display:none; align-items:center; justify-content:center; gap:6px;
    font-size:11px; color:var(--muted-2); padding:1px 0 3px;
    opacity:0; transition:opacity 200ms var(--ease-out);
  }
  .sync-indicator.show{ display:flex; opacity:1; }
  .sync-indicator .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); animation:sync-pulse 1s ease-in-out infinite; }
  @keyframes sync-pulse{ 0%,100%{ opacity:.3; } 50%{ opacity:1; } }

  .month-nav{ display:flex; align-items:center; justify-content:center; gap:16px; font-size:14px; color:var(--muted); }
  .month-nav .cur{ color:var(--ink); font-weight:700; min-width:100px; text-align:center; }
  .month-nav .arrow{
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); color:var(--muted-2); font-size:14px; background:var(--surface);
    cursor:pointer; transition:background 150ms var(--ease-out), transform 100ms var(--ease-out), border-color 150ms var(--ease-out);
  }
  .month-nav .arrow:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .month-nav .arrow:active{ transform:scale(.92); }

  .ledger{ background:var(--surface); border:1px solid var(--line-soft); border-radius:16px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; }
  .ledger-label{ font-size:11.5px; color:var(--muted); }
  .ledger-amt{ font-size:21px; font-weight:700; }
  .ledger-amt .u{ font-size:12px; font-weight:600; color:var(--muted); margin-left:2px; }
  .ledger-track{ position:relative; height:14px; border-radius:8px; background:var(--line-soft); }
  .ledger-fill{ position:absolute; inset:0 auto 0 0; width:0%; border-radius:8px; transition:width 700ms var(--ease-out); }
  .ledger-foot{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted-2); }
  .ledger-foot b{ font-weight:700; }

  .pace-badge{
    display:inline-flex; align-items:center; gap:5px; align-self:flex-start;
    font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:100px;
  }
  .pace-badge.over{ background:color-mix(in srgb, var(--over) 18%, transparent); color:var(--over); }
  .pace-badge.daily{ background:var(--accent-soft); color:var(--accent-ink); }
  .pace-badge.daily b{ font-weight:700; }
  .ledger-empty{ font-size:12px; color:var(--muted-2); }

  .mom-line{ font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px; }
  .mom-line b{ font-weight:700; }
  .mom-line.up{ color:var(--over); }
  .mom-line.down{ color:var(--pos); }
  .mom-line.flat{ color:var(--muted-2); }

  .donut-card{ background:var(--surface); border:1px solid var(--line-soft); border-radius:16px; padding:14px; display:flex; gap:16px; align-items:center; }
  .donut{ width:82px; height:82px; border-radius:50%; flex:none; position:relative; }
  .donut::after{ content:""; position:absolute; inset:15px; border-radius:50%; background:var(--surface); }
  .donut-legend{ display:flex; flex-direction:column; gap:6px; flex:1; min-width:0; max-height:150px; overflow-y:auto; }
  .dl-row{ display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted); }
  .dl-row .dot{ width:8px; height:8px; border-radius:2.5px; flex:none; }
  .dl-row .name{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dl-row .pct{ color:var(--muted-2); }
  .donut-empty{ font-size:12px; color:var(--muted-2); padding:8px 0; }

  .card-perf{ background:var(--surface); border:1px solid var(--line-soft); border-radius:16px; padding:14px 16px; display:none; flex-direction:column; gap:12px; }
  .card-perf-title{ font-size:11.5px; color:var(--muted); }
  .cp-row{ display:flex; flex-direction:column; gap:5px; }
  .cp-row-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:12px; }
  .cp-row-head .name{ font-weight:700; flex:none; }
  .cp-row-head .amt{ color:var(--muted); text-align:right; }
  .cp-track{ position:relative; height:8px; border-radius:6px; background:var(--line-soft); }
  .cp-fill{ position:absolute; inset:0 auto 0 0; width:0%; border-radius:6px; transition:width 700ms var(--ease-out); }
  .cp-pct{ font-size:10.5px; color:var(--muted-2); text-align:right; }

  .pm-badge{ display:inline-flex; align-items:center; gap:4px; font-size:10px; color:var(--muted-2); flex:none; max-width:64px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .pm-badge .pm-dot{ width:6px; height:6px; border-radius:50%; flex:none; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    font-size:11.5px; padding:6px 12px; border-radius:100px; border:1px solid var(--line);
    color:var(--muted); white-space:nowrap; background:var(--surface); cursor:pointer;
    transition:background 160ms var(--ease-out), color 160ms var(--ease-out), border-color 160ms var(--ease-out);
  }
  .chip:hover{ border-color:var(--accent); }
  .chip.on{ border-color:var(--accent); color:#fff; background:var(--accent); font-weight:600; }
  .chip.dashed{ border-style:dashed; }
  .chip.on.save-on{ background:var(--save); border-color:var(--save); }

  .list-sum{ font-size:12px; color:var(--muted); text-align:right; padding:0 2px; }
  .list-sum b{ color:var(--ink); font-weight:700; }

  .list{ display:flex; flex-direction:column; border:1px solid var(--line-soft); border-radius:14px; overflow:hidden; background:var(--surface); }
  .row{ display:flex; align-items:center; gap:9px; padding:11px 13px; border-bottom:1px solid var(--line-soft); font-size:12.5px; transition:background 150ms var(--ease-out); }
  .row:hover{ background:var(--surface-2); }
  .row:last-child{ border-bottom:none; }
  .row .cat-dot{ width:8px; height:8px; border-radius:2.5px; flex:none; }
  .row .date{ color:var(--muted-2); width:34px; flex:none; }
  .row .name{ flex:1; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .amt{ font-weight:600; flex:none; }
  .row .rt{ display:flex; gap:8px; flex:none; margin-left:2px; }
  .row .rt span{ color:var(--muted-2); font-size:10.5px; cursor:pointer; white-space:nowrap; }
  .row .rt .edit:hover{ color:var(--accent-ink); }
  .row .rt .del:hover{ color:var(--over); }
  .list-empty{ padding:24px 12px; text-align:center; font-size:12.5px; color:var(--muted-2); }

  .fab{
    position:fixed; right:calc(50% - 210px + 16px); bottom:24px; width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:300; box-shadow:0 8px 20px var(--accent-soft); border:none;
    cursor:pointer; transition:transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out); z-index:5;
  }
  @media (max-width:452px){ .fab{ right:24px; } }
  .fab:hover{ transform:translateY(-2px); }
  .fab:active{ transform:scale(.94); }

  .overlay{ position:fixed; inset:0; z-index:20; display:none; }
  .overlay.open{ display:block; }
  .dim{ position:absolute; inset:0; background:rgba(15,18,16,.4); opacity:0; animation:dim-in 220ms var(--ease-out) forwards; }
  @keyframes dim-in{ to{opacity:1;} }
  .sheet{
    position:absolute; left:50%; transform:translateX(-50%) translateY(100%); bottom:0; width:100%; max-width:420px;
    background:var(--surface); border-radius:22px 22px 0 0; border:1px solid var(--line); padding:16px 16px 22px;
    display:flex; flex-direction:column; gap:13px; box-shadow:0 -10px 30px var(--shadow); max-height:88dvh; overflow-y:auto;
    animation:sheet-in 320ms var(--ease-out) forwards;
  }
  @keyframes sheet-in{ to{ transform:translateX(-50%) translateY(0); } }
  .sheet-handle{ width:36px; height:4px; border-radius:3px; background:var(--line); margin:0 auto 2px; }
  .sheet-title{ font-weight:700; font-size:14.5px; display:flex; justify-content:space-between; align-items:center; }
  .sheet-close{ color:var(--muted-2); cursor:pointer; font-size:13px; }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11px; color:var(--muted-2); font-weight:600; }
  .field input{
    height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
    padding:0 12px; font-size:12.5px; color:var(--ink); width:100%; outline:none;
    transition:border-color 150ms var(--ease-out);
  }
  .field input:focus{ border-color:var(--accent); }
  .field input.amt{ text-align:right; font-weight:700; font-size:17px; background:var(--surface); }
  .field .hint{ font-size:10.5px; color:var(--muted-2); }

  .btn-primary{
    height:42px; border-radius:11px; background:var(--accent); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; font-size:13.5px; font-weight:700;
    cursor:pointer; transition:transform 140ms var(--ease-out), background 150ms var(--ease-out); width:100%;
  }
  .btn-primary:hover{ background:var(--accent-ink); }
  .btn-primary:active{ transform:scale(.98); }
  /* 지출 시트 저장 버튼: 크게 + 시트가 스크롤돼도 하단에 붙어 있음. 그림자는 뒤로 지나가는 칩을 가리는 용도 */
  .btn-save{ position:sticky; bottom:0; height:52px; font-size:15px; flex:none; box-shadow:0 0 0 10px var(--surface); }

  .settings-sec{ display:flex; flex-direction:column; gap:9px; }
  .settings-sec .title{ font-size:12px; font-weight:700; }
  .settings-sec .hint{ font-size:10.5px; color:var(--muted-2); }
  .setting-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border:1px solid var(--line-soft); border-radius:10px; font-size:12.5px; background:var(--surface); }
  .setting-row .name{ display:flex; align-items:center; gap:8px; }
  .setting-row .dot{ width:8px; height:8px; border-radius:2.5px; flex:none; }
  .setting-row .del{ color:var(--muted-2); cursor:pointer; font-size:11.5px; }
  .setting-row .del:hover{ color:var(--over); }
  .add-row{
    display:flex; align-items:center; justify-content:center; gap:6px; padding:10px;
    border:1px dashed var(--line); border-radius:10px; font-size:11.5px; color:var(--muted); background:none; width:100%;
    cursor:pointer; transition:border-color 150ms var(--ease-out), color 150ms var(--ease-out);
  }
  .add-row:hover{ border-color:var(--accent); color:var(--accent-ink); }

  .sync-row{ display:flex; gap:8px; }
  .sync-row input{ flex:1; }
  .sync-status{ font-size:10.5px; color:var(--muted-2); }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:1ms !important; transition-duration:1ms !important; } }
</style>
</head>
<body>

<div class="app" id="app">

  <div class="topbar">
    <div class="brand">개인 가계부</div>
    <div class="icon-btn" onclick="openSettings()" aria-label="설정">⚙</div>
  </div>

  <div class="sync-indicator" id="syncIndicator"></div>

  <div class="month-nav">
    <button class="arrow" onclick="shiftMonth(-1)">‹</button>
    <span class="cur num" id="monthLabel"></span>
    <button class="arrow" onclick="shiftMonth(1)">›</button>
  </div>

  <div class="card-perf" id="cardPerfCard"></div>

  <div class="ledger" id="ledgerCard"></div>

  <div class="donut-card" id="donutCard"></div>

  <div class="chip-row" id="filterChips"></div>

  <div class="list-sum num" id="listSum"></div>

  <div class="list" id="expenseList"></div>

  <button class="fab" onclick="openAddSheet()" aria-label="지출 추가">+</button>

</div>

<!-- Add/edit expense sheet -->
<div class="overlay" id="addOverlay">
  <div class="dim" onclick="closeAddSheet()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title"><span id="addSheetTitle">지출 추가</span><span class="sheet-close" onclick="closeAddSheet()">닫기</span></div>

    <div class="field">
      <label>날짜</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label>금액</label>
      <input type="text" id="fAmount" class="amt" placeholder="0" inputmode="numeric" oninput="formatAmountField(this)">
    </div>
    <div class="field">
      <label>항목명</label>
      <input type="text" id="fName" placeholder="예: 이마트 장보기">
    </div>
    <div class="field">
      <label>카테고리</label>
      <div class="chip-row" id="catChipRow"></div>
    </div>
    <div class="field">
      <label>결제수단</label>
      <div class="chip-row" id="pmChipRow"></div>
      <div class="chip-row" id="cardChipRow" style="display:none;"></div>
    </div>

    <button class="btn-primary btn-save" onclick="saveEntry()">저장</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="overlay" id="settingsOverlay">
  <div class="dim" onclick="closeSettings()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title"><span>설정</span><span class="sheet-close" onclick="closeSettings()">닫기</span></div>

    <div class="settings-sec">
      <div class="title" id="salaryTitle">이번 달 월급</div>
      <div class="field"><input type="number" id="fSalary" class="amt" placeholder="0" inputmode="numeric" onchange="saveSalary()"></div>
      <div class="hint">참고용이에요 — 실제 쓸 수 있는 한도는 아래 예산으로 따로 관리해요</div>
    </div>

    <div class="settings-sec">
      <div class="title" id="budgetTitle">이번 달 예산</div>
      <div class="field"><input type="number" id="fBudget" class="amt" placeholder="0" inputmode="numeric" onchange="saveBudget()"></div>
      <div class="hint">보고 있는 달 기준으로 설정돼요. 저축도 이 예산에서 차감돼요</div>
    </div>

    <div class="settings-sec">
      <div class="title">카테고리</div>
      <div id="catList"></div>
      <button class="add-row" onclick="addCategory()">+ 카테고리 추가</button>
    </div>

    <div class="settings-sec">
      <div class="title">신용카드</div>
      <div id="cardSettingsList"></div>
      <button class="add-row" onclick="addCard()">+ 카드 추가</button>
      <div class="hint">전월실적 기준액을 등록해두면 위쪽 대시보드에서 이번 달 진행률을 볼 수 있어요</div>
    </div>

    <div class="settings-sec">
      <div class="title">구글시트 동기화 (선택)</div>
      <div class="sync-row">
        <input type="text" id="fGasUrl" placeholder="GAS 웹앱 URL 붙여넣기">
        <button class="btn-primary" style="width:auto; padding:0 14px;" onclick="saveGasUrl()">URL 저장</button>
      </div>
      <div class="sync-row">
        <button class="btn-primary" id="btnPush" style="background:var(--accent);" onclick="pushToGas()">지금 업로드</button>
        <button class="btn-primary" id="btnPull" style="background:var(--muted-2);" onclick="pullFromGas()">지금 불러오기</button>
      </div>
      <div class="sync-status" id="syncStatus">동기화 안 됨 (로컬에만 저장)</div>
      <div class="hint">자동으로 올라가지 않아요 — 다른 기기와 맞추고 싶을 때 직접 눌러야 반영돼요</div>
    </div>

  </div>
</div>

<script>
'use strict';

// ── 상수 ────────────────────────────────────────────────────────────────
var DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwVgsv7bEH9f1v1nI5dpO9_KKI4Clx7QOtWh5skHM0xyuC9mpyFQgyaFRFg6QtKZ7URMw/exec';
var STORAGE_KEY = 'mb_data';
var GAS_URL_KEY = 'mb_gas_url';

var PALETTE = ['--p0','--p1','--p2','--p3','--p4','--p5','--p6','--p7','--p8','--p9','--p10','--p11'];

// ── 상태 ────────────────────────────────────────────────────────────────
// 월세/관리비는 공동자금에서 나가서 이 앱엔 없음. 저축은 세부카테고리 없는
// 단일 항목으로, 지출처럼 발생 시점에 기록하고 예산에서 차감됨 (사용자 확정)
var D = load() || {
  expenses: [],
  budgets: {},
  salaries: {},
  cats: ['식비','커피','생필품','의류','취미','교통비','구독료','폰요금','보험','의료비','경조사·선물','저축','기타'],
  cards: [], // 등록된 신용카드 목록 { id, name, target(전월실적 기준액) }. 체크카드/현금은 카드명 구분 없이 pmType만 기록
  _savedAt: 0
};
backfill(D);

// 예전 데이터 하위호환 — localStorage에서 읽을 때와 구글시트에서 받아올 때 둘 다 거침.
// save()를 안 부르므로 _savedAt이 안 바뀌어 동기화 판단에 영향 없음
function backfill(d){
  if(!d.salaries) d.salaries = {};
  if(!d.cards) d.cards = []; // 카드 필드 추가 전에 저장된 데이터
  // ponytail: 커피가 없으면 매번 식비 뒤에 다시 넣음 — 설정에서 커피를 지워도 다음 실행 때 되살아남. 지우고 싶어지면 이 줄 삭제
  if(d.cats.indexOf('커피') < 0) d.cats.splice(d.cats.indexOf('식비') + 1, 0, '커피');
}

// 지출 입력 시트에 바로 보이는 카테고리. 나머지는 "더보기"를 눌러야 나옴 (사용자 확정 2026-10-28)
// D.cats에 실제로 있는 이름만 보여주므로, 설정에서 지우거나 이름을 바꿔도 깨지지 않음
var MAIN_CATS = ['식비','커피','생필품','교통비','취미','저축'];
// 도넛 차트에서만 하나로 합쳐 보여주는 카테고리. 입력·리스트·필터는 각각 따로 (사용자 확정 2026-10-28)
var DONUT_GROUP = { '구독료':'고정비', '폰요금':'고정비', '보험':'고정비' };

var PM_TYPES = [ {key:'credit', label:'신용카드'}, {key:'check', label:'체크카드'}, {key:'cash', label:'현금'} ];

var today = new Date();
var viewMonth = ym(today);
var activeFilter = 'all';
var editingId = null; // null이면 새 항목 추가, 값이 있으면 해당 id의 항목을 수정 중
var selectedCat = null;
var catsExpanded = false; // 지출 시트에서 "더보기"를 눌렀는지. 한 번 펼치면 시트를 닫을 때까지 유지
var selectedPm = null; // null(미지정) | 'credit' | 'check' | 'cash' — 결제수단은 필수 아님
var selectedCardId = null; // selectedPm === 'credit'일 때만 사용

// ── 유틸 ────────────────────────────────────────────────────────────────
function ym(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysInMonth(ymStr){ var p=ymStr.split('-'); return new Date(Number(p[0]), Number(p[1]), 0).getDate(); }
function fmtWon(n){ return Math.round(n).toLocaleString() + '원'; }
function rawAmount(str){ return Number(String(str||'').replace(/[^0-9]/g,'')); }
function formatAmountField(el){
  var digits = el.value.replace(/[^0-9]/g,'');
  var caretFromEnd = el.value.length - el.selectionEnd;
  el.value = digits ? Number(digits).toLocaleString() : '';
  var pos = el.value.length - caretFromEnd;
  el.setSelectionRange(pos, pos);
}
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function monthLabel(ymStr){
  var p = ymStr.split('-');
  return p[0] + '년 ' + Number(p[1]) + '월';
}

function prevMonthOf(ymStr){
  var p = ymStr.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1 - 1, 1);
  return ym(d);
}

function shiftMonth(delta){
  var p = viewMonth.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
  viewMonth = ym(d);
  activeFilter = 'all';
  renderAll();
}

function expensesForMonth(ymStr){
  return D.expenses.filter(function(e){ return e.date.slice(0,7) === ymStr; });
}

function budgetForMonth(ymStr){ return D.budgets[ymStr] || 0; }
function salaryForMonth(ymStr){ return D.salaries[ymStr] || 0; }

// ── 저장 / 동기화 ─────────────────────────────────────────────────────────
function save(){
  D._savedAt = Date.now();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(D));
  // 구글시트 업로드는 자동으로 하지 않음 — 설정 화면의 "지금 업로드" 버튼을 눌러야만 나감
  // (living-cost 프로젝트에서 자동 동기화가 타이밍 버그를 일으킨 전례가 있어서, 이번에도 수동 트리거로 설계함)
}
function load(){
  try{ var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function gasUrl(){ return localStorage.getItem(GAS_URL_KEY) || DEFAULT_GAS_URL; }
function lastPushAt(){ return Number(localStorage.getItem('mb_last_push_at')) || 0; }

function saveGasUrl(){
  var v = document.getElementById('fGasUrl').value.trim();
  localStorage.setItem(GAS_URL_KEY, v);
  renderSyncStatus();
}

// 업로드: 지출을 저장/삭제할 때(quiet=true, 상단 표시) 또는 설정의
// "지금 업로드" 버튼(quiet=false, 버튼 자체에 표시)을 눌렀을 때만 실행됨.
// 자동 디바운스/타이머 트리거는 없음 — 매번 사용자의 명시적인 저장 행동에 바로 이어서만 나감
function pushToGas(quiet){
  var url = gasUrl();
  if(!url){
    if(!quiet) alert('먼저 GAS 웹앱 URL을 입력하고 저장해주세요');
    return;
  }
  var btn = quiet ? null : document.getElementById('btnPush');
  if(btn){ btn.textContent = '업로드 중...'; btn.disabled = true; }
  if(quiet) setSyncIndicator('<span class="dot"></span>구글시트에 업로드 중...');

  fetch(url, {
    method:'POST', mode:'no-cors',
    headers:{ 'Content-Type':'text/plain' },
    body: JSON.stringify(D)
  }).then(function(){
    localStorage.setItem('mb_last_push_at', String(Date.now()));
    renderSyncStatus();
    if(quiet) setSyncIndicator('구글시트에 저장했어요', true);
  }).catch(function(){
    if(!quiet) alert('업로드에 실패했어요. GAS 배포 URL이 맞는지 확인해주세요.');
    else setSyncIndicator('구글시트 업로드 실패 (연결 확인)', true);
  }).finally(function(){
    if(btn){ btn.textContent = '지금 업로드'; btn.disabled = false; }
  });
}

function setSyncIndicator(html, autoHide){
  var el = document.getElementById('syncIndicator');
  if(!el) return;
  if(!html){ el.classList.remove('show'); el.innerHTML = ''; return; }
  el.innerHTML = html;
  el.classList.add('show');
  clearTimeout(setSyncIndicator._t);
  if(autoHide){
    setSyncIndicator._t = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }
}

// 불러오기: force=true(버튼)면 로컬을 무조건 구글시트 내용으로 덮어씀
// 앱 시작 시에는 force=false로 호출 — 로컬이 더 최근이면 덮어쓰지 않음
// isInitial=true면 상단 "동기화 확인 중" 표시를 띄우고 결과를 알려줌
function loadFromGas(force, isInitial){
  var url = gasUrl();
  if(!url) return;
  if(force){
    var btn = document.getElementById('btnPull');
    if(btn){ btn.textContent = '불러오는 중...'; btn.disabled = true; }
  }
  if(isInitial) setSyncIndicator('<span class="dot"></span>동기화 확인 중...');

  fetch(url).then(function(r){ return r.json(); }).then(function(remote){
    if(!remote || remote.error || !remote.expenses){
      if(isInitial) setSyncIndicator('동기화 확인 실패', true);
      return;
    }
    var applied = force || (remote._savedAt||0) > (D._savedAt||0);
    if(applied){
      D = remote;
      backfill(D);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(D));
      renderAll();
    }
    if(isInitial) setSyncIndicator(applied ? '구글시트 최신 데이터 반영했어요' : '이미 최신 상태예요', true);
  }).catch(function(){
    if(force) alert('불러오기에 실패했어요. GAS 배포 URL이 맞는지 확인해주세요.');
    if(isInitial) setSyncIndicator('동기화 확인 실패 (연결 안 됨)', true);
  }).finally(function(){
    var btn = document.getElementById('btnPull');
    if(btn){ btn.textContent = '지금 불러오기'; btn.disabled = false; renderSyncStatus(); }
  });
}

function pullFromGas(){
  if(!gasUrl()){ alert('먼저 GAS 웹앱 URL을 입력하고 저장해주세요'); return; }
  if(!confirm('구글시트 내용으로 덮어쓸까요? 아직 업로드 안 한 로컬 변경사항은 사라져요.')) return;
  loadFromGas(true);
}

function renderSyncStatus(){
  var el = document.getElementById('syncStatus');
  if(!el) return;
  if(!gasUrl()){ el.textContent = '동기화 안 됨 (로컬에만 저장)'; return; }
  var t = lastPushAt();
  el.textContent = t ? ('마지막 업로드: ' + new Date(t).toLocaleString('ko-KR')) : '아직 업로드한 적 없어요';
}

// ── 렌더 ────────────────────────────────────────────────────────────────
function renderAll(){
  document.getElementById('monthLabel').textContent = monthLabel(viewMonth);
  renderCardPerf();
  renderLedger();
  renderDonut();
  renderFilterChips();
  renderExpenseList();
}

// 카드별 이번 달(보고 있는 달) 신용카드 사용액 — pmType이 'credit'이고 해당 카드로 태깅된 지출만 합산.
// 결제수단 미지정/체크카드/현금 지출은 여기 안 잡힘(사용자 확정: 카드실적은 소급 적용 안 하고 앞으로 입력하는 것부터)
function cardSpend(cardId, ymStr){
  return expensesForMonth(ymStr)
    .filter(function(e){ return e.pmType === 'credit' && e.cardId === cardId; })
    .reduce(function(s,e){ return s + Number(e.amount||0); }, 0);
}

function renderCardPerf(){
  var el = document.getElementById('cardPerfCard');
  if(!D.cards.length){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'flex';

  var rows = D.cards.map(function(c){
    var spent = cardSpend(c.id, viewMonth);
    var target = Number(c.target) || 0;
    var pct = target ? Math.min(999, Math.round(spent / target * 100)) : 0;
    var achieved = target > 0 && spent >= target;
    var trackHtml = target
      ? ('<div class="cp-track"><div class="cp-fill" style="background:' + (achieved ? 'var(--pos)' : 'var(--accent)') + ';" data-pct="' + Math.min(100, pct) + '"></div></div>' +
         '<div class="cp-pct">' + (achieved ? '✓ 실적 채웠어요' : pct + '% 달성') + '</div>')
      : '<div class="cp-pct">설정에서 기준액을 등록해보세요</div>';
    return '<div class="cp-row">' +
      '<div class="cp-row-head"><span class="name">' + escapeHtml(c.name) + '</span><span class="amt num">' + fmtWon(spent) + (target ? (' / ' + fmtWon(target)) : '') + '</span></div>' +
      trackHtml +
    '</div>';
  }).join('');

  el.innerHTML = '<div class="card-perf-title">신용카드 실적 · ' + monthLabel(viewMonth) + '</div>' + rows;

  requestAnimationFrame(function(){
    el.querySelectorAll('.cp-fill').forEach(function(f){ f.style.width = f.getAttribute('data-pct') + '%'; });
  });
}

function renderLedger(){
  var list = expensesForMonth(viewMonth);
  var spent = list.reduce(function(s,e){ return s + Number(e.amount||0); }, 0);
  var budget = budgetForMonth(viewMonth);
  var salary = salaryForMonth(viewMonth);
  var el = document.getElementById('ledgerCard');

  if(!budget){
    el.innerHTML =
      '<div class="ledger-label">이번 달 예산이 아직 없어요</div>' +
      '<div class="ledger-amt num">' + fmtWon(spent) + '<span class="u">썼어요</span></div>' +
      '<div class="ledger-empty">설정에서 이번 달 예산을 입력하면 게이지가 표시돼요</div>';
    return;
  }

  var pct = Math.min(999, Math.round(spent / budget * 100));
  var isCurrentMonth = viewMonth === ym(today);

  // "오늘부터 남은 기간 동안 하루에 얼마씩 쓸 수 있는지"를 그때그때 계산해서 보여줌 —
  // 판정(빠르다/느리다)이 아니라 정보라서, 큰 지출이 갑자기 나가서 하루 예산이 훅 줄어도 자연스러움
  var fillColor = 'var(--pos)';
  var badgeHtml = '';
  if(spent > budget){
    fillColor = 'var(--over)';
    badgeHtml = '<div class="pace-badge over">▲ 예산 초과</div>';
  } else if(isCurrentMonth){
    var daysRemaining = daysInMonth(viewMonth) - today.getDate() + 1;
    var dailyAllowance = (budget - spent) / daysRemaining;
    badgeHtml = '<div class="pace-badge daily">오늘부터 하루 <b class="num">' + fmtWon(dailyAllowance) + '</b> 쓸 수 있어요</div>';
  }

  var budgetLabel = salary
    ? ('월급 <span class="num">' + salary.toLocaleString() + '</span>원 중 예산 <span class="num">' + budget.toLocaleString() + '</span>원')
    : ('이번 달 예산 <span class="num">' + budget.toLocaleString() + '</span>원');

  el.innerHTML =
    '<div class="ledger-label">' + budgetLabel + '</div>' +
    '<div class="ledger-amt num">' + fmtWon(spent) + '<span class="u">썼어요</span></div>' +
    badgeHtml +
    '<div class="ledger-track">' +
      '<div class="ledger-fill" style="width:0%; background:' + fillColor + ';" id="ledgerFillEl"></div>' +
    '</div>' +
    '<div class="ledger-foot num">' +
      '<span>' + fmtWon(Math.max(0, budget - spent)) + ' 남음</span>' +
      '<span>' + pct + '% 사용</span>' +
    '</div>' +
    momLineHtml(spent, isCurrentMonth);

  requestAnimationFrame(function(){
    var fillEl = document.getElementById('ledgerFillEl');
    if(fillEl) fillEl.style.width = Math.min(100, pct) + '%';
  });
}

// 전월 대비 더/덜 썼는지 — 저번달 지출 기록이 아예 없으면(비교 대상 없음) 표시 안 함.
// 이번 달(보는 중인 달이 오늘 기준 현재 달)이면 "지금까지" 라고 붙여서 한 달 다 지난
// 저번달과 단순 비교라는 걸 알 수 있게 함 (일별로 맞춰서 비교하진 않음 — MVP 단순화)
function momLineHtml(spent, isCurrentMonth){
  var prevMonthStr = prevMonthOf(viewMonth);
  var prevList = expensesForMonth(prevMonthStr);
  if(!prevList.length) return '';
  var prevSpent = prevList.reduce(function(s,e){ return s + Number(e.amount||0); }, 0);
  var diff = spent - prevSpent;
  var suffix = isCurrentMonth ? '지금까지 ' : '';
  if(diff > 0){
    return '<div class="mom-line up">▲ 저번달보다 ' + suffix + '<b class="num">' + fmtWon(diff) + '</b> 더 썼어요</div>';
  } else if(diff < 0){
    return '<div class="mom-line down">▼ 저번달보다 ' + suffix + '<b class="num">' + fmtWon(-diff) + '</b> 덜 썼어요</div>';
  }
  return '<div class="mom-line flat">저번달과 ' + suffix + '똑같이 썼어요</div>';
}

function catColor(name, idx){
  return cssVar(PALETTE[idx % PALETTE.length]);
}

function categoryBreakdown(){
  var list = expensesForMonth(viewMonth);
  var total = list.reduce(function(s,e){ return s + Number(e.amount||0); }, 0);
  var buckets = {};
  var order = [];

  list.forEach(function(e){
    var key = DONUT_GROUP[e.cat] || e.cat;
    if(!buckets[key]){
      buckets[key] = { label:key, colorCat:e.cat, amount:0 }; // 묶음(고정비)은 처음 나온 하위 카테고리 색을 씀
      order.push(key);
    }
    buckets[key].amount += Number(e.amount||0);
  });

  var result = order.map(function(key){
    var b = buckets[key];
    var idx = D.cats.indexOf(b.colorCat);
    if(idx < 0) idx = 0;
    return { label:b.label, amount:b.amount, pct: total? Math.round(b.amount/total*100):0, color: catColor(b.label, idx) };
  }).sort(function(a,b){ return b.amount - a.amount; });

  return { total:total, rows:result };
}

function renderDonut(){
  var el = document.getElementById('donutCard');
  var data = categoryBreakdown();
  if(!data.rows.length){
    el.innerHTML = '<div class="donut-empty">아직 이번 달 지출이 없어요</div>';
    return;
  }
  var gradParts = [];
  var acc = 0;
  data.rows.forEach(function(r){
    var start = acc;
    acc += r.pct;
    gradParts.push(r.color + ' ' + start + '% ' + acc + '%');
  });
  if(acc < 100) gradParts.push(cssVar('--line') + ' ' + acc + '% 100%');

  var legend = data.rows.map(function(r){
    return '<div class="dl-row"><span class="dot" style="background:' + r.color + ';"></span><span class="name">' + r.label + '</span><span class="pct num">' + r.pct + '% · ' + fmtWon(r.amount) + '</span></div>';
  }).join('');

  el.innerHTML =
    '<div class="donut" style="background:conic-gradient(' + gradParts.join(',') + ');"></div>' +
    '<div class="donut-legend">' + legend + '</div>';
}

function renderFilterChips(){
  var el = document.getElementById('filterChips');
  var chips = ['<span class="chip ' + (activeFilter==='all'?'on':'') + '" onclick="setFilter(\'all\')">전체</span>'];
  D.cats.forEach(function(c){
    var isSave = c === '저축';
    chips.push('<span class="chip ' + (isSave?'dashed':'') + ' ' + (activeFilter===c?('on'+(isSave?' save-on':'')):'') + '" onclick="setFilter(\'' + c + '\')">' + c + '</span>');
  });
  el.innerHTML = chips.join('');
}

function setFilter(f){ activeFilter = f; renderFilterChips(); renderExpenseList(); }

// 결제수단 색점 + 텍스트. 색은 카테고리 팔레트와 별개로 결제수단 3종 고정색(신용/체크/현금).
// 신용카드는 카드명, 체크카드/현금은 그 단어 그대로. 미지정 지출(e.pmType 없음)엔 아예 표시 안 함
function pmBadgeHtml(e){
  if(!e.pmType) return '';
  var color, text;
  if(e.pmType === 'credit'){
    color = cssVar('--over');
    var card = D.cards.find(function(c){ return c.id === e.cardId; });
    text = card ? card.name : '카드(삭제됨)';
  } else if(e.pmType === 'check'){
    color = cssVar('--p3');
    text = '체크카드';
  } else {
    color = cssVar('--muted-2');
    text = '현금';
  }
  return '<span class="pm-badge"><span class="pm-dot" style="background:' + color + ';"></span>' + escapeHtml(text) + '</span>';
}

function expenseRowHtml(e){
  var idx = D.cats.indexOf(e.cat);
  if(idx < 0) idx = 0;
  var color = catColor(e.cat, idx);
  var d = e.date.split('-');
  return '<div class="row">' +
    '<span class="cat-dot" style="background:' + color + ';"></span>' +
    '<span class="date num">' + Number(d[1]) + '/' + Number(d[2]) + '</span>' +
    '<span class="name">' + escapeHtml(e.name) + '</span>' +
    pmBadgeHtml(e) +
    '<span class="amt num">' + fmtWon(e.amount) + '</span>' +
    '<span class="rt"><span class="edit" onclick="openEditExpense(\'' + e.id + '\')">수정</span><span class="del" onclick="tryDeleteExpense(\'' + e.id + '\')">삭제</span></span>' +
  '</div>';
}

function byDateDesc(a,b){ return b.date.localeCompare(a.date) || b.id.localeCompare(a.id); }

function renderExpenseList(){
  var el = document.getElementById('expenseList');
  var sumEl = document.getElementById('listSum');

  var filtered = expensesForMonth(viewMonth).filter(function(e){
    return activeFilter === 'all' || e.cat === activeFilter;
  }).sort(byDateDesc);

  if(activeFilter === 'all'){
    sumEl.innerHTML = '';
  } else {
    var catSum = filtered.reduce(function(s,e){ return s + Number(e.amount||0); }, 0);
    sumEl.innerHTML = filtered.length ? ('합계 <b>' + fmtWon(catSum) + '</b>') : '';
  }

  el.innerHTML = filtered.length ? filtered.map(expenseRowHtml).join('') : '<div class="list-empty">해당하는 내역이 없어요</div>';
}

function escapeHtml(s){ var d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }

function tryDeleteExpense(id){
  var e = D.expenses.find(function(x){ return x.id === id; });
  if(!e) return;
  if(confirm(escapeHtml(e.name) + ' (' + fmtWon(e.amount) + ') 삭제할까요?')){
    D.expenses = D.expenses.filter(function(x){ return x.id !== id; });
    save();
    renderAll();
    if(gasUrl()) pushToGas(true);
  }
}

// ── 지출 추가/수정 시트 ──────────────────────────────────────────────────
function openAddSheet(){
  editingId = null;
  document.getElementById('addSheetTitle').textContent = '지출 추가';
  document.getElementById('fDate').value = todayStr();
  document.getElementById('fAmount').value = '';
  document.getElementById('fName').value = '';
  selectedCat = null;
  catsExpanded = false;
  selectedPm = null;
  selectedCardId = null;
  renderCatChips();
  renderPmChips();
  document.getElementById('addOverlay').classList.add('open');
}
function closeAddSheet(){ document.getElementById('addOverlay').classList.remove('open'); editingId = null; }

function openEditExpense(id){
  var e = D.expenses.find(function(x){ return x.id === id; });
  if(!e) return;
  editingId = id;
  document.getElementById('addSheetTitle').textContent = '지출 수정';
  document.getElementById('fDate').value = e.date;
  document.getElementById('fAmount').value = Number(e.amount).toLocaleString();
  document.getElementById('fName').value = e.name;
  selectedCat = e.cat;
  catsExpanded = MAIN_CATS.indexOf(e.cat) < 0; // 숨김 쪽 카테고리면 선택된 게 보이도록 펼친 채로 열기
  selectedPm = e.pmType || null;
  selectedCardId = e.cardId || null;
  renderCatChips();
  renderPmChips();
  document.getElementById('addOverlay').classList.add('open');
}

// 자주 쓰는 것 먼저, 펼치면 나머지를 뒤에 이어 붙임 (펼쳐도 앞쪽 칩 위치는 그대로)
function renderCatChips(){
  var el = document.getElementById('catChipRow');
  var main = D.cats.filter(function(c){ return MAIN_CATS.indexOf(c) >= 0; });
  var rest = D.cats.filter(function(c){ return MAIN_CATS.indexOf(c) < 0; });
  var chips = main.concat(catsExpanded ? rest : []).map(function(c){
    var isSave = c === '저축';
    return '<span class="chip ' + (isSave?'dashed':'') + ' ' + (selectedCat===c?('on'+(isSave?' save-on':'')):'') + '" onclick="pickCat(\'' + c + '\')">' + c + '</span>';
  });
  if(!catsExpanded && rest.length) chips.push('<span class="chip dashed" onclick="catsExpanded=true; renderCatChips()">더보기 ▾</span>');
  el.innerHTML = chips.join('');
}
function pickCat(c){ selectedCat = c; renderCatChips(); }

function renderPmChips(){
  var el = document.getElementById('pmChipRow');
  el.innerHTML = PM_TYPES.map(function(p){
    return '<span class="chip ' + (selectedPm===p.key?'on':'') + '" onclick="pickPm(\'' + p.key + '\')">' + p.label + '</span>';
  }).join('');
  renderCardChipRow();
}
function pickPm(key){
  selectedPm = (selectedPm === key) ? null : key; // 같은 칩 다시 누르면 미지정으로 해제
  if(selectedPm !== 'credit') selectedCardId = null;
  renderPmChips();
}
function renderCardChipRow(){
  var el = document.getElementById('cardChipRow');
  if(selectedPm !== 'credit' || !D.cards.length){
    el.style.display = 'none'; el.innerHTML = '';
    return;
  }
  el.style.display = 'flex';
  el.innerHTML = D.cards.map(function(c){
    return '<span class="chip ' + (selectedCardId===c.id?'on':'') + '" onclick="pickCard(\'' + c.id + '\')">' + escapeHtml(c.name) + '</span>';
  }).join('');
}
function pickCard(id){ selectedCardId = (selectedCardId === id) ? null : id; renderCardChipRow(); }

function saveEntry(){
  var date = document.getElementById('fDate').value;
  var amount = rawAmount(document.getElementById('fAmount').value);
  var name = document.getElementById('fName').value.trim();

  if(!date){ alert('날짜를 선택해주세요'); return; }
  if(!amount || amount <= 0){ alert('금액을 입력해주세요'); return; }
  if(!name){ alert('항목명을 입력해주세요'); return; }
  if(!selectedCat){ alert('카테고리를 선택해주세요'); return; }

  var pmType = selectedPm || null;
  var cardId = (pmType === 'credit') ? selectedCardId : null;

  if(editingId){
    var entry = D.expenses.find(function(x){ return x.id === editingId; });
    if(entry){ entry.date = date; entry.amount = amount; entry.name = name; entry.cat = selectedCat; entry.pmType = pmType; entry.cardId = cardId; }
  } else {
    D.expenses.push({ id: uid(), date: date, amount: amount, name: name, cat: selectedCat, pmType: pmType, cardId: cardId });
  }

  save();
  closeAddSheet();
  viewMonth = date.slice(0,7);
  renderAll();
  if(gasUrl()) pushToGas(true); // 저장 직후 바로 구글시트까지 반영
}

// ── 설정 시트 ───────────────────────────────────────────────────────────
function openSettings(){
  document.getElementById('salaryTitle').textContent = monthLabel(viewMonth) + ' 월급';
  document.getElementById('fSalary').value = D.salaries[viewMonth] || '';
  document.getElementById('budgetTitle').textContent = monthLabel(viewMonth) + ' 예산';
  document.getElementById('fBudget').value = D.budgets[viewMonth] || '';
  document.getElementById('fGasUrl').value = gasUrl();
  renderSyncStatus();
  renderCatSettingsList();
  renderCardSettingsList();
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettings(){ document.getElementById('settingsOverlay').classList.remove('open'); renderAll(); }

function saveSalary(){
  var v = Number(document.getElementById('fSalary').value) || 0;
  D.salaries[viewMonth] = v;
  save();
}

function saveBudget(){
  var v = Number(document.getElementById('fBudget').value) || 0;
  D.budgets[viewMonth] = v;
  save();
}

function renderCatSettingsList(){
  var el = document.getElementById('catList');
  el.innerHTML = D.cats.map(function(c,i){
    return '<div class="setting-row"><span class="name"><span class="dot" style="background:' + catColor(c,i) + ';"></span>' + escapeHtml(c) + '</span><span class="del" onclick="removeCategory(\'' + c + '\')">삭제</span></div>';
  }).join('');
}

function addCategory(){
  var name = prompt('추가할 카테고리 이름');
  if(!name) return;
  name = name.trim();
  if(!name) return;
  if(D.cats.indexOf(name) >= 0){ alert('이미 있는 이름이에요'); return; }
  D.cats.push(name);
  save();
  renderCatSettingsList();
}

function removeCategory(name){
  if(!confirm('"' + name + '" 카테고리를 삭제할까요? (기존 지출 기록은 유지돼요)')) return;
  D.cats = D.cats.filter(function(c){ return c !== name; });
  save();
  renderCatSettingsList();
}

// ── 신용카드 관리 (카테고리와 동일한 패턴) ──────────────────────────────────
function renderCardSettingsList(){
  var el = document.getElementById('cardSettingsList');
  if(!D.cards.length){ el.innerHTML = '<div class="hint">등록된 카드가 없어요</div>'; return; }
  el.innerHTML = D.cards.map(function(c){
    return '<div class="setting-row"><span class="name">' + escapeHtml(c.name) +
      ' <span style="color:var(--muted-2);font-weight:400;">(' + fmtWon(Number(c.target)||0) + ' 기준)</span></span>' +
      '<span class="del" onclick="removeCard(\'' + c.id + '\')">삭제</span></div>';
  }).join('');
}

function addCard(){
  var name = prompt('카드 이름 (예: 현대카드)');
  if(!name) return;
  name = name.trim();
  if(!name) return;
  var targetStr = prompt('전월실적 기준액 (원, 숫자만)');
  var target = Number(targetStr) || 0;
  D.cards.push({ id: uid(), name: name, target: target });
  save();
  renderCardSettingsList();
}

// 카드 삭제 — 카테고리 삭제와 동일한 방침: 기존 지출 기록은 그대로 두고,
// 카드실적 카드/리스트 표시에서만 사라짐(pmBadgeHtml에서 "카드(삭제됨)"으로 대체 표시)
function removeCard(id){
  var c = D.cards.find(function(x){ return x.id === id; });
  if(!c) return;
  if(!confirm('"' + c.name + '" 카드를 삭제할까요? (기존 지출 기록은 유지되지만 카드명 표시는 사라져요)')) return;
  D.cards = D.cards.filter(function(x){ return x.id !== id; });
  save();
  renderCardSettingsList();
}

// ── 초기화 ──────────────────────────────────────────────────────────────
renderAll();
if(gasUrl()) loadFromGas(false, true);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
